config:
  target: "http://localhost:3001"
  phases:
    - duration: 50
      arrivalCount: 250
  processor: "./processor.js"
  engines:
    socketio: {}

scenarios:
  - name: "Bot join room and interact"
    engine: socketio
    flow:
      - function: "assignBotData"
      - emit:
          channel: "room:join"
          data:
            roomId: "{{ roomId }}"
            token: "{{ token }}"
            expiresAt: "{{ expiresAt }}"
          response:
            channel: "room:joined"
      - loop:
          - think: 3
          - emit:
              channel: "room:status"
              data:
                statusIcon: "☕"
              response:
                channel: "room:status-changed"
          - think: 2
          - emit:
              channel: "room:chat"
              data:
                content: "Hello everyone, bot is studying!"
              response:
                channel: "room:message"
          - think: 3
          - emit:
              channel: "room:status"
              data:
                statusIcon: "📚"
              response:
                channel: "room:status-changed"
        count: 8
      - emit:
          channel: "room:leave"
